<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic tack toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="msg-container hide">
            <p id="msg">winner</p>
            <button class="newGame">New game</button>
        </div>
        <h1>Tic Tack Toe</h1>
        <div class="container">
            <div class="game">
                <button class="box" id="0"></button>
                <button class="box" id="1"></button>
                <button class="box" id="2"></button>
                <button class="box" id="3"></button>
                <button class="box" id="4"></button>
                <button class="box" id="5"></button>
                <button class="box" id="6"></button>
                <button class="box" id="7"></button>
                <button class="box" id="8"></button>
            </div>
        </div>
        <div class="reset">
            <button class="resetGame">Reset Game</button>
        </div>
        <div class="tie-msg hide">
            <p id="Tie-msg">Tie Reset Game.</p>
        </div>
    </main>
</body>
<script src="app.js"></script>
</html>
